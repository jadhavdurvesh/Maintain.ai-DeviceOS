name: Build Maintain.ai DeviceOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            bundles: nsis
          - platform: macos
            runner: macos-latest
            bundles: dmg
          - platform: linux
            runner: ubuntu-22.04
            bundles: deb,appimage

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libssl-dev \
            libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Generate Tauri bundle icons
        run: npx tauri icon src-tauri/icons/icon.svg --output src-tauri/icons

      - name: Build and package Tauri application
        run: npm exec tauri build -- --bundles "${{ matrix.bundles }}"

      - name: Upload packaged installers
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-deviceos-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
