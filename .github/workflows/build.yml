name: Build Maintain.ai DeviceOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            bundles: nsis
          - platform: macos
            runner: macos-latest
            bundles: dmg
          - platform: linux
            runner: ubuntu-22.04
            bundles: deb,appimage

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libssl-dev \
            libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Generate Tauri bundle icons
        run: npm exec tauri icon src-tauri/icons/icon.svg -- --output src-tauri/icons

      - name: Build and package Tauri application
        run: npm exec tauri build -- --bundles "${{ matrix.bundles }}"

      - name: Upload unsigned Windows installer
        if: matrix.platform == 'windows'
        id: upload-unsigned-windows
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-deviceos-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign Windows installer with SignPath
        if: matrix.platform == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: sign-windows
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows
          wait-for-completion-timeout-in-seconds: 900

      - name: Verify signed Windows installer
        if: matrix.platform == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path signed-windows -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw 'SignPath did not return a signed Windows installer.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows Authenticode signature is not valid: $($signature.Status)"
          }

      - name: Upload signed Windows installer
        if: matrix.platform == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-deviceos-windows
          path: signed-windows/**/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Windows installer for development
        if: matrix.platform == 'windows' && vars.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-deviceos-windows-unsigned-development
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-deviceos-macos
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux installers
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-deviceos-linux
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
